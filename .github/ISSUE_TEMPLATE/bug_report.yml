name: "Bug report"
description: Create a report to help us improve
title: "Bug: "
labels: ["bug"]

body:
  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the bug
      description: Provide a clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Include relevant source code and/or steps to reproduce the behavior.
      placeholder: |
        ```python
        # Minimal reproducible example
        ...
        ```

        Steps:
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: Describe what is actually happening clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, attach screenshots to help illustrate the problem.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your project and system environment (e.g., OS, Python version, package versions, etc.).
      placeholder: |
        - OS:
        - Python version:
        - Package version:
        - Installation method:
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Provide any other relevant context or information about the problem here.
    validations:
      required: false
